# Checks every push and pull request: the assets with Python alone, then the
# plugin with Claude Code itself (validate and the test suite), at a pinned
# version. Neither needs a login or a secret: nothing here calls a model.
name: CI

on:
  push:
    branches: [main, 'ci-**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assets:
    name: Assets (JSON, schemes, scripts, versions)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 -I scripts/check_assets.py

  plugin:
    name: Plugin (validate, tests) on Claude Code ${{ matrix.claude }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        claude: ['2.1.299']
    env:
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm install --global @anthropic-ai/claude-code@${{ matrix.claude }}
      - run: claude --version
      - run: claude plugin validate .
      - run: claude plugin test .
