# Checks every push and pull request, and every morning.
#
# - Assets: the JSON, schemes, scripts, pictures, links and versions, with Python alone.
# - Plugin: validate (strict) and the test suite on macOS, Windows and Linux, with
#   the oldest Claude Code cc-skins supports and the newest.
# - Install: the marketplace and an install, as a person does them, on all three.
# - Released: the release people install now (the marketplace's tag), tested with
#   the newest Claude Code.
#
# The morning run is there because a new Claude Code can break the plugin without
# a push here: it finds that before the people using it do (GitHub mails the
# repository's owner when a scheduled run fails). Nothing here needs a login or a
# secret: nothing calls a model.
name: CI

on:
  push:
    branches: [main, 'ci-**']
  pull_request:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'

jobs:
  assets:
    name: Assets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 -I scripts/check_assets.py

  plugin:
    name: Plugin (${{ matrix.os }}, Claude Code ${{ matrix.claude }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # the oldest that passes (hooks/doctor.ts MIN_CLAUDE_CODE) and the newest
        claude: ['2.1.295', 'latest']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm install --global @anthropic-ai/claude-code@${{ matrix.claude }}
      - run: claude --version
      - run: claude plugin validate . --strict
      - run: claude plugin test .

  install:
    name: Install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm install --global @anthropic-ai/claude-code@latest
      - run: claude plugin marketplace add ./
      - run: claude plugin install cc-skins@cc-skins
      - name: The plugin is installed and on
        run: |
          claude plugin list | tee list.txt
          grep -q 'cc-skins@cc-skins' list.txt
          grep -q 'enabled' list.txt

  released:
    name: Released version (${{ matrix.os }}, newest Claude Code)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check out the release the marketplace points at
        run: |
          tag=$(node -p "require('./.claude-plugin/marketplace.json').plugins.find(p => p.name === 'cc-skins').source.ref")
          echo "Released: $tag"
          git worktree add released "$tag"
      - run: npm install --global @anthropic-ai/claude-code@latest
      - run: claude plugin validate released
      - run: claude plugin test released
